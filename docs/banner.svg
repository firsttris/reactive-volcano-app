<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Reactive Vaporizer App</title>
  <desc id="d">An unofficial web app that controls compatible vaporizers over Web Bluetooth, straight from the browser.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121214"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="0.15" r="0.5">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1f1f23" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)" opacity="0.55"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="23.5" fill="none" stroke="#27272a"/>

  <!-- App icon, as in the app header -->
  <g transform="translate(64 66)">
    <rect width="80" height="80" rx="20" fill="#f97316"/>
    <path d="M28 28l24 24-12 12V16l12 12-24 24" fill="none" stroke="#0a0a0a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="168" y="104" fill="#fafafa" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.2">Reactive Vaporizer App</text>
  <text x="170" y="140" fill="#a1a1aa" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22">Web Bluetooth control for your vaporizer. No install, no account.</text>

  <!-- Feature chips -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600">
    <rect x="64" y="200" width="168" height="40" rx="20" fill="#18181b" stroke="#27272a"/>
    <text x="148" y="226" fill="#e4e4e7" text-anchor="middle">Live temperature</text>
    <rect x="244" y="200" width="174" height="40" rx="20" fill="#18181b" stroke="#27272a"/>
    <text x="331" y="226" fill="#e4e4e7" text-anchor="middle">Heat-up workflows</text>
    <rect x="430" y="200" width="168" height="40" rx="20" fill="#18181b" stroke="#27272a"/>
    <text x="514" y="226" fill="#e4e4e7" text-anchor="middle">Device settings</text>
    <rect x="64" y="252" width="160" height="40" rx="20" fill="#18181b" stroke="#27272a"/>
    <text x="144" y="278" fill="#e4e4e7" text-anchor="middle">Self-diagnosis</text>
    <rect x="236" y="252" width="176" height="40" rx="20" fill="#18181b" stroke="#27272a"/>
    <text x="324" y="278" fill="#e4e4e7" text-anchor="middle">Installable PWA</text>
    <rect x="424" y="252" width="174" height="40" rx="20" fill="#18181b" stroke="#27272a"/>
    <text x="511" y="278" fill="#e4e4e7" text-anchor="middle">Docker &amp; self-host</text>
  </g>

  <!-- Temperature gauge, as on the control screen -->
  <g transform="translate(1000 196)">
    <path d="M-92.5 92.5 A130.8 130.8 0 1 1 92.5 92.5" fill="none" stroke="#27272a" stroke-width="14" stroke-linecap="round"/>
    <path d="M-92.5 92.5 A130.8 130.8 0 1 1 127.5 -29" fill="none" stroke="url(#arc)" stroke-width="14" stroke-linecap="round" filter="url(#blur)" opacity="0.6"/>
    <path d="M-92.5 92.5 A130.8 130.8 0 1 1 127.5 -29" fill="none" stroke="url(#arc)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="127.5" cy="-29" r="11" fill="#09090b" stroke="#fafafa" stroke-width="4"/>
    <text x="0" y="-42" fill="#a1a1aa" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3" text-anchor="middle">NOW</text>
    <text x="-6" y="34" fill="#fafafa" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="300" text-anchor="middle" letter-spacing="-2">185</text>
    <text x="78" y="-6" fill="#a1a1aa" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26">°C</text>
    <rect x="-62" y="56" width="124" height="30" rx="15" fill="#f97316" fill-opacity="0.16"/>
    <circle cx="-44" cy="71" r="4" fill="#f97316"/>
    <text x="8" y="77" fill="#f97316" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Heating up</text>
  </g>
</svg>
