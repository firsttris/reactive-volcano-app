name: Build

# Pull requests: lint, unit tests, build, the documentation (MkDocs), E2E tests
# and a Docker build check.
# Pushes to main: the same checks, then deployment to GitHub Pages: the app at
# https://firsttris.github.io/reactive-volcano-app/ and the documentation
# website built from docs/ under /docs/.
# Releases (Docker Hub) are a separate workflow, see release.yml.
on:
  push:
    branches: ["main"]
    paths-ignore: ["README.md", "README_de.md", "CONTRIBUTING.md", "LICENSE"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["README.md", "README_de.md", "CONTRIBUTING.md", "LICENSE"]
  workflow_dispatch:
  # The release workflow runs the same checks before it publishes anything
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its outdated run; runs on main finish
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  check:
    name: Lint, unit tests & build
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Annotates problems inline in the pull request diff
      - name: Lint
        run: npx biome ci --reporter=github .

      - name: Unit tests
        run: npm test

      # Includes the type check (tsc) after compiling the messages
      - name: Build
        run: npm run build

      # GitHub Pages has no SPA fallback; serve the app for unknown paths so
      # deep links like /connect survive a reload.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      # The deploy job adds the documentation website before publishing
      - name: Upload app
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: app
          path: dist
          if-no-files-found: error
          retention-days: 1

  # docs/ as a website with MkDocs Material (mkdocs.yml). --strict fails on a
  # broken link or anchor, so pull requests catch them before they are published.
  docs:
    name: Docs
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # git-revision-date needs the history for "last updated"
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt

      - name: Build
        run: mkdocs build --strict

      - name: Upload docs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site
          if-no-files-found: error
          retention-days: 1

  # The Playwright container must match the installed @playwright/test, so
  # read the version from the lockfile instead of hard-coding it here
  playwright-version:
    name: Playwright version
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout lockfile
        uses: actions/checkout@v7
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E tests
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Catches a broken Dockerfile before it breaks a release
  docker:
    name: Docker build
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [check, e2e, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # Only one deployment at a time; a running one is never cancelled
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download app
        uses: actions/download-artifact@v8
        with:
          name: app
          path: dist

      # The documentation lives next to the app: /reactive-volcano-app/docs/
      - name: Download docs
        uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: dist/docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
