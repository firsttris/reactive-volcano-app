name: Build

# Pull requests: lint, unit tests, build, the documentation (MkDocs), E2E tests
# and a Docker build check.
# Pushes to main: the same checks, then deployment to GitHub Pages: the app at
# https://firsttris.github.io/reactive-volcano-app/ and the documentation
# website built from docs/ under /docs/.
# Releases (Docker Hub) are a separate workflow, see release.yml.
on:
  push:
    branches: ["main"]
    paths-ignore: ["README.md", "README_de.md", "CONTRIBUTING.md", "LICENSE"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["README.md", "README_de.md", "CONTRIBUTING.md", "LICENSE"]
  workflow_dispatch:
  # The release workflow runs the same checks before it publishes anything
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its outdated run; runs on main finish
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, unit tests & build
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Bun of packageManager in package.json
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Annotates problems inline in the pull request diff
      - name: Lint
        run: bunx biome ci --reporter=github .

      - name: Unit tests
        run: bun run test

      # Includes the type check (tsc) after compiling the messages
      - name: Build
        run: bun run build

      # GitHub Pages has no SPA fallback; serve the app for unknown paths so
      # deep links like /connect survive a reload.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      # The deploy job adds the documentation website before publishing
      - name: Upload app
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: app
          path: dist
          if-no-files-found: error
          retention-days: 1

  # docs/ as a website with MkDocs Material (mkdocs.yml). --strict fails on a
  # broken link or anchor, so pull requests catch them before they are published.
  docs:
    name: Docs
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # git-revision-date needs the history for "last updated"
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt

      - name: Build
        run: mkdocs build --strict

      - name: Upload docs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site
          if-no-files-found: error
          retention-days: 1

  # The Playwright container must match the installed @playwright/test, so
  # read the version from the lockfile instead of hard-coding it here
  playwright-version:
    name: Playwright version
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.version.outputs.image }}
    steps:
      - name: Image of the @playwright/test version in bun.lock
        id: version
        uses: firsttris/workflows/actions/playwright-image@v1
        with:
          lockfile: bun.lock

  e2e:
    name: E2E tests
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ needs.playwright-version.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The npm package brings the binary without curl or unzip, which the image lacks.
      # The image has no jq; node reads the version from packageManager, in an assignment of its
      # own so that a failure stops the step instead of installing npm's latest Bun.
      - name: Setup Bun
        run: |
          version=$(node -p "require('./package.json').packageManager.split('@')[1]")
          npm install --global "bun@$version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Playwright tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Catches a broken Dockerfile before it breaks a release. Shares the registry build cache with
  # the release's amd64 build (ghcr.io/firsttris/reactive-volcano-app-buildcache), so an unchanged
  # bun install and build stage come from the cache in both directions.
  docker:
    name: Docker build
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # keeps the build cache
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        uses: firsttris/workflows/actions/docker-build@v1
        with:
          dockerfile: Dockerfile
          tags: reactive-volcano-app:ci

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [check, e2e, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # Only one deployment at a time; a running one is never cancelled
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download app
        uses: actions/download-artifact@v8
        with:
          name: app
          path: dist

      # The documentation lives next to the app: /reactive-volcano-app/docs/
      - name: Download docs
        uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: dist/docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
